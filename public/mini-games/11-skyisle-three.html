/* ── 시안 11 : SKYISLE LIVING 11 (three.js 판) ──────────────────────────────
   10번과 같은 게임 규칙 · 같은 화면 부품 자리를 three.js(WebGL 2)로 다시 그렸다. 화면 장식(종이 카드 · 금색 테두리 · 글꼴 · 칩)은
   10번의 CSS 를 그대로 옮겼다(2026-10-06 15:34 KST 판). WebGL 2 라서 WebGPU 가 꺼진 브라우저와 https 가 아닌 주소에서도 열린다.
   ☁️ 구름 바다: 높이 지도 구름을 광선 행진으로 그린다 — 해 쪽 은빛 테두리 · 골짜기 그늘 · 먼 구름은 지평선 빛에 녹는다
   🌤 햇살 줄기: 그림자 지도를 따라 시선 방향으로 걸으며 빛이 닿는 공기만 모은다(반 해상도 · 깊이를 보며 다시 키운다)
   🌸 벚나무: 휘어진 관으로 만든 가지 + 꽃송이 카드 · 역광에 분홍빛이 비친다 · 꽃잎은 10번의 공기역학 계산 그대로
   🌿 풀밭 · 💧 폭포와 샘 · 💎 수정 · 빛의 정령(빛으로 주사위를 들어 올려 던진다) · 🎥 시작 섬 돌기 · BEGIN 날아 들어가기 · 6 다가가기 · 승리 한 바퀴
   9·10번에서 대표가 정한 것(아침으로 시작 · 모션 블러 없음 · 초점 흐림 없음 · 원목 주사위와 빨간 1 · 별빛 요정 효과)은 그대로 지킨다.
   10번의 돼지는 옮기지 않았다 — 구·원뿔로 조립한 캐릭터라 새 코드에 쓸 수 없다(그림은 Draw Things 규칙). 내 굴림에 대한 반응은 정령이 맡는다.
   ──────────────────────────────────────────────────────────────────── */
:root{--gold:#d8b96b;--gold2:#a8862f;--ink:#3a3552;--muted:#7b7690;--paper:#fbf6ea;--btn-a:#ffffff;--btn-b:#f6f0e1;--btn-ring:rgba(255,255,255,.6);--gate:#f4ecdc;--shade:rgba(40,30,90,.18);
  --vig:rgba(84,54,30,.30);--flash:rgba(156,138,201,.42);--veil:rgba(30,24,20,.58);
  --teal:#5fd4b8;--water:#5aa8ff;--spark:#ffcfe8;--fairy:#f2a6d6;--fizzle:#9c8ac9;
  --font-d:'Marcellus','Gowun Batang',serif;--font-b:'Noto Sans KR',sans-serif}
/* 어두운 테마: 먹색 카드 · 금색 테두리 그대로 · 크림색 글자. 처음엔 기기 설정을 따르고 오른쪽 위 칩으로 바꾼다 */
:root[data-theme="dark"]{--ink:#f2e8d2;--muted:#b8ab92;--gold2:#d8b96b;--paper:#26221d;--btn-a:#342e27;--btn-b:#221e19;--btn-ring:rgba(255,255,255,.07);--gate:#1d1a16;--shade:rgba(0,0,0,.42)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--gate);color:var(--ink);font-family:var(--font-b);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
/* 가장자리 그늘: 9번의 남보랏빛 대신 따뜻한 갈색빛 (금지 목록 — 보라색 그라데이션) */
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,var(--vig) 100%)}
/* 1이 나올 때 번쩍임: 같은 보랏빛을 그라데이션 없이 한 색으로 */
.flash{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:var(--flash)}
.flash.on{animation:flash .7s ease-out}@keyframes flash{0%{opacity:1}100%{opacity:0}}
.hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 16px max(34px,calc(env(safe-area-inset-bottom) + 20px))}
/* 카드: 9번의 반투명 흐림 종이 대신 같은 종이색 불투명 (금지 목록 — 유리처럼 비치는 카드) */

.card::before,.card::after{content:"◆";position:absolute;top:50%;transform:translateY(-50%);font-size:9px;color:var(--gold2)}
.card::before{left:-5px}.card::after{right:-5px}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.brand{padding:10px 14px}
.brand h1{font-family:var(--font-d);font-size:clamp(15px,4vw,22px);letter-spacing:.14em}
.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--gold2);margin-top:3px}
.bank{padding:8px 18px;text-align:center}
.bank .n{font-size:10px;letter-spacing:.3em;color:var(--gold2)}
.bank b{display:block;font-family:var(--font-d);font-size:clamp(26px,7vw,40px);line-height:1.1}
.bank.bump b{animation:bump .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{35%{transform:scale(1.18);color:var(--gold2)}}
/* 설정 칩 4개(시간 · 소리 · 언어 · 테마): 넓은 화면은 한 줄, 좁은 화면은 2줄 — 자리는 9번처럼 오른쪽 위 */
.right{justify-self:end;display:grid;grid-auto-flow:column;gap:8px;pointer-events:auto}

.p{padding:10px 16px;min-width:110px;transition:transform .3s}

.bottom{pointer-events:auto;display:grid;gap:10px;max-width:640px;width:100%;margin:0 auto}
.status{text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 6px rgba(40,30,90,.7);min-height:18px;letter-spacing:.04em}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button.act{font-family:var(--font-d);font-size:clamp(14px,3.8vw,18px);letter-spacing:.2em;color:var(--ink);cursor:pointer;padding:15px 10px;border:1px solid var(--gold);border-radius:999px;
  background:linear-gradient(180deg,var(--btn-a),var(--btn-b));box-shadow:0 6px 20px var(--shade),inset 0 0 0 3px var(--btn-ring);position:relative;transition:transform .08s,filter .2s}

button.act:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.6)}
.callout{position:fixed;left:50%;top:30%;transform:translateX(-50%);z-index:5;font-family:var(--font-d);font-size:clamp(30px,9vw,64px);letter-spacing:.12em;color:#fff;opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 0 14px var(--teal),0 2px 0 rgba(40,30,90,.5),0 0 40px rgba(95,212,184,.7)}
.callout.on{animation:callout 1.2s cubic-bezier(.2,1.3,.3,1) forwards}
.callout.bad{text-shadow:0 0 14px var(--fizzle),0 2px 0 rgba(50,40,70,.6),0 0 40px rgba(156,138,201,.8)}
.callout.water{text-shadow:0 0 14px var(--fairy),0 2px 0 rgba(80,20,60,.55),0 0 40px rgba(242,166,214,.8)}

.fly{position:fixed;z-index:8;pointer-events:none;font-family:var(--font-d);font-size:26px;color:#fff;text-shadow:0 0 14px var(--water),0 2px 0 rgba(20,40,90,.6)}
.hint{position:fixed;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));z-index:4;text-align:center;font-size:9px;letter-spacing:.3em;color:rgba(255,255,255,.7);pointer-events:none;white-space:pre}
/* 시작 창: 초기화 중에는 종이색 한 색(9번의 하늘색 그라데이션 대신 — 금지 목록), 준비되면 바탕이 걷혀 섬을 도는 실제 3D 장면 위에 카드만 남는다 */
.gate{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--gate);text-align:center;padding:30px;transition:opacity .6s,background-color 1.4s}
.gate.ready{background-color:transparent}
.gate.off{opacity:0;pointer-events:none}
.gate .card{padding:30px 36px;display:inline-block}
.gate b{display:block;font-family:var(--font-d);font-size:clamp(20px,5vw,32px);letter-spacing:.3em;margin-bottom:10px}
.gate p{font-size:12px;letter-spacing:.1em;color:var(--muted);line-height:1.8}
.gate button{margin-top:22px}
/* 결과 창 뒤: 9번의 보랏빛 반투명 + 흐림 대신 흐림 없는 어두운 먹색 (금지 목록) */
.overlay{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:var(--veil);opacity:0;pointer-events:none;transition:opacity .5s}
.overlay.on{opacity:1;pointer-events:auto}
.overlay .card{padding:32px 40px;text-align:center}
.big{font-family:var(--font-d);font-size:clamp(28px,8vw,64px);letter-spacing:.2em;line-height:1.1}
.big.lose{color:#8a4a3a}
.overlay.on .big{animation:zoom .8s cubic-bezier(.2,1.4,.3,1)}
@keyframes zoom{from{transform:scale(2);opacity:0;letter-spacing:.6em}}
.final{margin:14px 0 24px;font-size:12px;letter-spacing:.3em;color:var(--muted)}
:root[data-theme="dark"] .big.lose{color:#e3937a}
/* 한국어: 넓은 자간은 영문 대문자에 맞춘 값이라 한글에는 좁힌다. 한글 제목은 고운바탕(Marcellus 에 한글이 없어 글자 단위로 넘어간다) */
html[lang="ko"] body{word-break:keep-all}   /* 한글은 낱말 단위로만 줄을 바꾼다('하늘 / 섬', '준비됐습 / 니다' 같은 쪼개짐 방지) */
.gate button,.overlay button{min-width:160px}   /* '시작'·'다시'처럼 짧은 글자에서도 알약 모양을 지킨다 */
html[lang="ko"] .brand h1,html[lang="ko"] .gate b,html[lang="ko"] .big{letter-spacing:.08em}
html[lang="ko"] .brand small,html[lang="ko"] .bank .n,html[lang="ko"] .p .n,html[lang="ko"] .chip,html[lang="ko"] .final,html[lang="ko"] .hint,html[lang="ko"] button.act,html[lang="ko"] .callout{letter-spacing:.06em}
/* 한글 버튼 글자가 고운바탕 글꼴 탓에 상자 중심보다 아래로 처진다 — 10번과 같은 보정(위 여백 -1px · 아래 +1px · 높이 그대로).
   2026-10-06 · 11번 버튼 2개 실측(보정 전) 굴리기 +0.84px · 지키기 +0.5px, 같은 버튼의 영어는 -0.02/-0.09px */
html[lang="ko"] button.act{padding-top:14px;padding-bottom:16px}
/* 글자 덩어리 세로 중심 보정(frontend-ui 글자 세로 정렬 · 축 B): 큰 숫자 줄은 숫자 아래 여백 때문에 잉크가 위로, 제목 카드는 아래로 치우친다.
   위아래 여백만 나눠 바꿔 상자 높이는 그대로 둔다. 2026-10-06 · 창 1868×1559 · Marcellus · Gowun Batang · Noto Sans KR · ko/en 각 1회 실측(보정 전):

/* ═══════════ 🔊 합성 효과음 (10번 그대로 + 물소리 · 정령 소리) ═══════════ */

const SFX=(()=>{let ac=null,master=null,on=true,windGain=null,waterGain=null;
  function ctx(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.45;master.connect(ac.destination);}if(ac.state==='suspended')ac.resume();return ac;}

/* ═══════════ 물리 (10번과 같은 값 — 묵직한 원목 착지감 · 잘 튕기는 보이지 않는 울타리) ═══════════ */
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-30,0),allowSleep:true});
const matGround=new CANNON.Material('ground'),matWall=new CANNON.Material('wall'),matDie=new CANNON.Material('die');
world.addContactMaterial(new CANNON.ContactMaterial(matDie,matGround,{friction:.55,restitution:.12}));
world.addContactMaterial(new CANNON.ContactMaterial(matDie,matWall,{friction:.04,restitution:.92}));
const ground=new CANNON.Body({mass:0,shape:new CANNON.Plane(),material:matGround});ground.quaternion.setFromEuler(-Math.PI/2,0,0);world.addBody(ground);
const WALLS=new Set();for(let k=0;k<10;k++){const a=k/10*Math.PI*2,R=3.15;const b=new CANNON.Body({mass:0,shape:new CANNON.Box(new CANNON.Vec3(1.2,3,.15)),material:matWall});b.position.set(Math.cos(a)*R,3,Math.sin(a)*R);b.quaternion.setFromEuler(0,-a+Math.PI/2,0);world.addBody(b);WALLS.add(b);}

body.addEventListener('collide',e=>{const v=Math.abs(e.contact.getImpactVelocityAlongNormal());if(v<2.5)return;const p=body.position;
  if(WALLS.has(e.body)){barrierRipple(p.x,p.y,p.z,Math.min(1,v/14));return;}
  puff(p.x,.05,p.z,Math.min(24,v*3));kickPetals(p.x,p.z,v);SFX.knock(Math.min(1,v/12));if(v>7)shake(.18);});
// 멈출 때까지 기다린다 — 물리와 같은 시계(T)로 재서, 탭이 가려져 물리가 멈춘 동안은 세지 않는다(돌아오자마자 공중의 주사위로 판정하지 않게)
